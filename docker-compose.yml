version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: neuro_postgres
    restart: always
    environment:
      POSTGRES_USER: neuro_user
      POSTGRES_PASSWORD: neuro_password
      POSTGRES_DB: neuro_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql

  nginx:
    image: nginx:alpine
    container_name: neuro_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/neuro.conf:/etc/nginx/conf.d/default.conf
    # Permite que Nginx dentro de Docker se comunique con FastAPI en tu Windows
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data: