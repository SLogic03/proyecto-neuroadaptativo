version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: neuro_postgres
    restart: always
    environment:
      POSTGRES_USER: neuro_user
      POSTGRES_PASSWORD: neuro_password
      POSTGRES_DB: neuro_db
    ports:
      - "5432:5432"
    volumes:
      # Esto hace que los datos no se borren si apagas la computadora
      - postgres_data:/var/lib/postgresql/data
      # Esto inyecta el script SQL para que se ejecute la primera vez que arranca
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
