<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Plataforma Neuroadaptativa</title>
    <meta name="description"
        content="Panel principal de la plataforma de inducción neuroadaptativa. Visualiza tu progreso, tareas pendientes y eventos.">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: 'var(--bg-color)',
                        foreground: 'var(--text-color)',
                        surface: 'var(--surface-bg)',
                        card: 'var(--card-bg)',
                        border: 'var(--surface-border)',
                        muted: 'var(--muted-text)',
                        accent: '#3b82f6'
                    },
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif'],
                        'serif': ['"Source Serif 4"', 'Georgia', 'serif'],
                    },
                },
            },
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap"
        rel="stylesheet">

    <style>
        /* ── LIGHT MODE (default) ──────────────────────────────── */
        :root, [data-theme="light"] {
            --bg-color: #fcfcfc;
            --text-color: #111827;
            --surface-bg: #ffffff;
            --surface-border: #e5e7eb;
            --card-bg: #ffffff;
            --muted-text: #6b7280;
        }

        /* ── DARK MODE ─────────────────────────────────────────── */
        [data-theme="dark"] {
            --bg-color: #0a0a0a;
            --text-color: #f3f4f6;
            --surface-bg: #171717;
            --surface-border: #262626;
            --card-bg: #171717;
            --muted-text: #9ca3af;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Minimalist Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--surface-border);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--muted-text);
        }

        /* Radial progress ring */
        .progress-ring-circle {
            transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        /* Pulse dot */
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.4); }
        }
        .pulse-dot {
            animation: pulse-dot 2s ease-in-out infinite;
        }
    </style>
</head>

<body class="font-sans antialiased min-h-screen bg-background text-foreground flex flex-col">

    <!-- TOP HEADER -->
    <header class="fixed top-0 w-full h-16 bg-surface border-b border-border z-50 flex items-center justify-between px-6 shadow-sm transition-colors duration-300">
        <!-- Brand -->
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded bg-accent flex items-center justify-center text-white font-bold text-sm">N</div>
            <h1 class="text-lg font-semibold tracking-tight hidden sm:block">NeuroAdapt</h1>
        </div>
        
        <!-- User -->
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-border flex items-center justify-center text-xs font-bold text-foreground" id="user-avatar">--</div>
                <div class="text-right hidden sm:block">
                    <p class="text-sm font-medium leading-tight" id="user-name">Loading...</p>
                    <p class="text-xs text-muted leading-tight" id="user-role">Student</p>
                </div>
            </div>
            <button id="btn-logout" title="Cerrar sesión" class="text-muted hover:text-foreground transition-colors ml-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
                </svg>
            </button>
        </div>
    </header>

    <div class="flex flex-1 pt-16">

        <!-- SIDEBAR -->
        <aside class="w-64 bg-surface border-r border-border flex flex-col fixed h-[calc(100vh-4rem)] z-40 hidden md:flex transition-colors duration-300">
            <!-- Navigation -->
            <nav class="flex-1 px-4 py-6 space-y-1 overflow-y-auto">
                <p class="px-4 mb-3 text-xs font-semibold tracking-widest uppercase text-muted">Main</p>

                <a href="dashboard.html"
                    class="flex items-center gap-3 px-4 py-3 rounded-xl bg-accent/10 text-accent font-medium text-sm transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z" />
                    </svg>
                    Dashboard
                </a>

                <a href="#courses-container"
                    class="flex items-center gap-3 px-4 py-3 rounded-xl text-muted hover:text-foreground hover:bg-border/50 font-medium text-sm transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
                    </svg>
                    Mis Cursos
                </a>
                <div id="sidebar-courses-list" class="ml-4 space-y-0.5 mt-2 border-l border-border pl-2">
                    <!-- JS inyecta links a cada curso real -->
                </div>
            </nav>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 md:ml-64 p-8 lg:p-10 max-w-7xl mx-auto w-full">

            <!-- Header -->
            <header class="mb-12 flex items-end justify-between">
                <div>
                    <p class="text-base text-muted mb-2">Welcome back,</p>
                    <h2 class="text-4xl font-sans font-bold tracking-tight">Dashboard</h2>
                </div>
                <div class="flex items-center gap-6">
                    <div class="text-right">
                        <p class="text-xs text-muted uppercase tracking-wider font-semibold mb-1">Session</p>
                        <p class="text-sm font-medium bg-card px-3 py-1 rounded-xl shadow-sm border border-border"
                            id="session-clock">00:00:00</p>
                    </div>
                </div>
            </header>

            <!-- Grid -->
            <div class="grid grid-cols-12 gap-8">

                <!-- Stats Overview (filled dynamically by JS) -->
                <div id="stats-container" class="col-span-12 grid grid-cols-1 sm:grid-cols-3 gap-6">
                    <!-- JS inyecta: Progreso Global, Tiempo Total, Quizzes Completados -->
                </div>

                <!-- My Courses (Dynamic) -->
                <div class="col-span-12 bg-card rounded-2xl p-8 shadow-sm border border-border transition-colors duration-300">
                    <div class="flex items-center justify-between mb-6">
                        <p class="text-xs font-semibold tracking-widest uppercase text-muted">Mis Módulos</p>
                        <span id="courses-count" class="text-xs text-muted bg-border px-2 py-1 rounded-xl">Loading...</span>
                    </div>
                    <div id="courses-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <p class="text-sm text-muted py-4 text-center col-span-full">Cargando cursos...</p>
                    </div>
                </div>

            </div><!-- /grid -->
        </main>
    </div>

    <!-- Session Timer Script -->
    <script>
            (function () {
                const start = Date.now();
                const el = document.getElementById('session-clock');
                function tick() {
                    const s = Math.floor((Date.now() - start) / 1000);
                    const h = String(Math.floor(s / 3600)).padStart(2, '0');
                    const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
                    const sec = String(s % 60).padStart(2, '0');
                    el.textContent = h + ':' + m + ':' + sec;
                }
                setInterval(tick, 1000);
            })();
    </script>

    <script src="js/dashboard.js"></script>
    <script src="js/telemetry.js"></script>
</body>

</html>
