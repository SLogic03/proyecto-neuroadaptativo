<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro — NeuroAdapt</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif'],
                    },
                },
            },
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { background-color: #f8fafc; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>

<body class="font-sans text-slate-800 antialiased min-h-screen flex items-center justify-center bg-slate-50 py-10">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg border border-slate-200 p-10 fade-in">
        <!-- Brand -->
        <div class="flex items-center gap-3 mb-8">
            <div class="w-11 h-11 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold text-lg">N</div>
            <div>
                <h1 class="text-lg font-semibold tracking-tight text-slate-900">NeuroAdapt</h1>
                <p class="text-xs text-slate-500 tracking-wider uppercase">Registro de Estudiantes</p>
            </div>
        </div>

        <form id="register-form" class="space-y-4">
            <div>
                <label for="reg-name" class="block text-xs font-semibold tracking-wider uppercase text-slate-500 mb-2">Nombre Completo</label>
                <input id="reg-name" type="text" required
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition placeholder:text-slate-400"
                    placeholder="Ej. Juan Pérez">
            </div>
            
            <div>
                <label for="reg-email" class="block text-xs font-semibold tracking-wider uppercase text-slate-500 mb-2">Correo Electrónico</label>
                <input id="reg-email" type="email" required
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition placeholder:text-slate-400"
                    placeholder="estudiante@espe.edu.ec">
            </div>

            <div>
                <label for="reg-studentid" class="block text-xs font-semibold tracking-wider uppercase text-slate-500 mb-2">ID de Estudiante (ESPE ID)</label>
                <input id="reg-studentid" type="text" required
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition placeholder:text-slate-400"
                    placeholder="L00000000">
            </div>

            <div>
                <label for="reg-password" class="block text-xs font-semibold tracking-wider uppercase text-slate-500 mb-2">Contraseña</label>
                <input id="reg-password" type="password" required minlength="6"
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition placeholder:text-slate-400"
                    placeholder="••••••••">
            </div>

            <div id="reg-error" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-xl p-3 mt-4"></div>

            <button id="reg-btn" type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm py-3 rounded-xl transition-all shadow-sm hover:shadow-md active:scale-[0.98] mt-6">
                Crear Cuenta
            </button>
        </form>

        <div id="reg-success" class="hidden text-center fade-in">
            <div class="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-emerald-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <h3 class="text-lg font-bold text-slate-900 mb-2">¡Registro completado!</h3>
            <p class="text-sm text-slate-600 mb-6">Tu cuenta ha sido creada exitosamente. Sin embargo, para poder ingresar, <strong>un administrador debe aprobar tu solicitud</strong>.</p>
        </div>
        
        <p id="login-link-container" class="mt-6 text-center text-sm text-slate-500">¿Ya tienes cuenta? <a href="login.html" class="text-blue-600 hover:text-blue-700 font-semibold hover:underline transition-colors">Iniciar sesión</a></p>
    </div>

    <script src="js/register.js"></script>
</body>
</html>
