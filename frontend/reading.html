<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo de Lectura — Plataforma Neuroadaptativa</title>
    <meta name="description" content="Lectura interactiva con adaptación neuroadaptativa. El sistema monitorea tu estado cognitivo y adapta la experiencia en tiempo real.">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif'],
                        'serif': ['"Source Serif 4"', 'Georgia', 'serif'],
                    },
                },
            },
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Dynamic variables controlled by LLM via JS */
            --dyn-font-size: 1.125rem;
            --dyn-line-height: 1.75;
            --dyn-letter-spacing: normal;
            --dyn-bg-color: #f8fafc;
            --dyn-text-color: #1e293b;
        }

        body { 
            background-color: var(--dyn-bg-color);
            overflow-x: hidden;
            transition: background-color 0.7s ease-in-out;
        }
        
        /* Minimalist Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .pulse-dot {
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.5; transform: scale(1.4); }
        }

        /* Reading focus guide styles */
        #reading-focus-guide {
            position: absolute;
            left: -2rem;
            right: -2rem;
            height: 3em;
            background: rgba(59, 130, 246, 0.05); /* very soft blue */
            border-left: 4px solid #3b82f6;
            pointer-events: none;
            transition: top 0.2s ease-out;
            z-index: 10;
        }

        /* Reading content dynamic application */
        #reading-content {
            font-size: var(--dyn-font-size);
            line-height: var(--dyn-line-height);
            letter-spacing: var(--dyn-letter-spacing);
            background-color: var(--dyn-bg-color);
            color: var(--dyn-text-color);
            transition: all 0.5s ease-in-out;
        }

        #reading-content p {
            margin-bottom: 1.5em;
        }

        /* Sidebar transition for agentic mode hiding */
        #sidebar {
            transition: transform 0.4s ease-in-out;
        }
    </style>
</head>

<body class="font-sans text-slate-800 antialiased min-h-screen bg-slate-50 flex flex-col">

    <!-- TOP HEADER -->
    <header class="fixed top-0 w-full h-16 bg-slate-900 border-b border-slate-800 z-50 flex items-center justify-between px-6 shadow-md">
        <!-- Brand -->
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded bg-blue-600 flex items-center justify-center text-white font-bold text-sm">N</div>
            <h1 class="text-lg font-semibold tracking-tight text-white hidden sm:block">NeuroAdapt</h1>
        </div>
        
        <!-- User -->
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-xs font-bold text-white" id="user-avatar">--</div>
                <div class="text-right hidden sm:block">
                    <p class="text-sm font-medium text-white leading-tight" id="user-name">Loading...</p>
                    <p class="text-xs text-slate-400 leading-tight" id="user-role">Student</p>
                </div>
            </div>
            <button id="btn-logout" title="Cerrar sesión" class="text-slate-400 hover:text-white transition-colors ml-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
                </svg>
            </button>
        </div>
    </header>

    <div class="flex flex-1 pt-16 relative">

        <!-- SIDEBAR -->
        <aside id="sidebar" class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col fixed h-[calc(100vh-4rem)] z-40 transform translate-x-0 transition-transform duration-400 hidden md:flex">
            <!-- Navigation -->
            <nav class="flex-1 px-4 py-6 space-y-1 overflow-y-auto">
                <p class="px-4 mb-3 text-xs font-semibold tracking-widest uppercase text-slate-500">Main</p>

                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-md text-slate-400 hover:text-white hover:bg-slate-800 font-medium text-sm transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z"/></svg>
                    Dashboard
                </a>

                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-md text-slate-400 hover:text-white hover:bg-slate-800 font-medium text-sm transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"/></svg>
                    Mis Cursos
                </a>

                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-md bg-blue-600/10 text-blue-400 font-medium text-sm transition-all">
                    <svg class="w-5 h-5 text-current" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714a2.25 2.25 0 00.659 1.591L19 14.5M14.25 3.104c.251.023.501.05.75.082M19 14.5l-2.47 2.47a3.375 3.375 0 01-4.06.52L12 17.25l-.47.24a3.375 3.375 0 01-4.06-.52L5 14.5m14 0V19a2.25 2.25 0 01-2.25 2.25H7.25A2.25 2.25 0 015 19v-4.5"/></svg>
                    Módulo de Lectura
                </a>
            </nav>
        </aside>

        <!-- MAIN CONTENT (Centered Reading Container) -->
        <main id="reading-container" class="flex-1 md:ml-64 p-6 lg:p-10 transition-all duration-500 mx-auto w-full flex flex-col items-center">

            <!-- Breadcrumb & Header -->
            <header class="mb-6 w-full max-w-4xl mx-auto">
                <div class="flex items-center gap-2 mb-3">
                    <a href="courses.html" class="text-slate-500 hover:text-blue-600 transition-colors text-sm font-medium">My Courses</a>
                    <svg class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
                    <span class="text-sm font-medium text-blue-600">Institutional Regulations</span>
                </div>
                <h2 id="course-title" class="text-4xl font-serif font-bold text-slate-900 tracking-tight leading-snug">
                    Cargando curso...
                </h2>
                
                <!-- Neuro Status -->
                <div class="mt-6 flex items-center justify-between border-b border-slate-200 pb-6">
                    <div id="neuro-status" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-100 border border-slate-200 transition-all duration-300">
                        <div class="w-2 h-2 rounded-full bg-slate-400" id="neuro-dot"></div>
                        <span class="text-xs font-semibold text-slate-600" id="neuro-label">NeuroAdapt Pending</span>
                    </div>
                </div>
            </header>

            <!-- Text Content -->
            <article id="reading-content" class="relative font-serif rounded-xl p-10 sm:p-16 shadow-sm border border-slate-200 bg-white w-full max-w-4xl mx-auto prose prose-slate prose-lg leading-relaxed mt-6">
                
                <!-- Focus Guide (Hidden by default, can be toggled by LLM via telemetry.js) -->
                <div id="reading-focus-guide" class="hidden"></div>
            </article>

            <!-- Agent Panel Placeholder (For simplified summary injection if needed) -->
            <div id="agent-panel" class="mt-8 hidden p-6 rounded-2xl bg-blue-50 border border-blue-100">
                <h4 class="text-sm font-bold text-blue-800 mb-3 uppercase tracking-wider">💡 Resumen Simplificado</h4>
                <div id="agent-summary-content" class="text-blue-900 text-sm space-y-2">
                    <!-- LLM injects summary here -->
                </div>
            </div>

        </main>
    </div>


    <!-- Scripts -->
    <script src="js/reading.js?v=2"></script>
    <script src="js/telemetry.js?v=2"></script>
</body>
</html>
