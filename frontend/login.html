<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — NeuroAdapt</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif'],
                    },
                },
            },
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { background-color: #f8fafc; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>

<body class="font-sans text-slate-800 antialiased min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-slate-100">

    <div class="w-full max-w-sm bg-white rounded-2xl shadow-lg border border-slate-200 p-10 fade-in">
        <!-- Brand -->
        <div class="flex items-center gap-3 mb-8">
            <div class="w-11 h-11 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold text-lg">N</div>
            <div>
                <h1 class="text-lg font-semibold tracking-tight text-slate-900">NeuroAdapt</h1>
                <p class="text-xs text-slate-500 tracking-wider uppercase">Plataforma Institucional</p>
            </div>
        </div>

        <form id="student-login-form" class="space-y-5">
            <div>
                <label for="login-email" class="block text-xs font-semibold tracking-wider uppercase text-slate-500 mb-2">Email Institucional</label>
                <input id="login-email" type="email" required autocomplete="username"
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition placeholder:text-slate-400"
                    placeholder="estudiante@espe.edu.ec">
            </div>
            <div>
                <label for="login-password" class="block text-xs font-semibold tracking-wider uppercase text-slate-500 mb-2">Contraseña</label>
                <input id="login-password" type="password" required autocomplete="current-password"
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition placeholder:text-slate-400"
                    placeholder="••••••••">
            </div>

            <div id="login-error" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-xl p-3"></div>

            <button id="login-btn" type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm py-3 rounded-xl transition-all shadow-sm hover:shadow-md active:scale-[0.98]">
                Entrar
            </button>
        </form>
        
        <p class="mt-6 text-center text-xs text-slate-400">Acceso exclusivo para usuarios registrados por la administración.</p>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
